name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          install-go: false

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.24', stable]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: go test
        run: go test -race ./...
        if: runner.os != 'Windows'
      - name: go test (no race)
        run: go test ./...
        if: runner.os == 'Windows'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the badge to the badges branch (main only)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: go test -cover
        # Only the library package: cmd/ and internal/scenes are tooling.
        run: go test -coverprofile=cover.out -covermode=atomic .
      - name: Coverage badge
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: cover.out
          git-token: ${{ github.event_name == 'push' && github.ref_name == 'main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

  cross:
    name: Cross-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['js/wasm', 'linux/386', 'linux/arm64', 'linux/arm']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: go build ${{ matrix.target }}
        run: |
          export GOOS=${TARGET%/*} GOARCH=${TARGET#*/}
          go build ./...
          go vet ./...
        env:
          TARGET: ${{ matrix.target }}

  modules:
    name: Submodules (bench, harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: |
            bench/go.sum
            harness/go.sum
      - name: bench
        working-directory: bench
        run: go vet ./...
      - name: harness
        working-directory: harness
        run: |
          go vet ./...
          go test ./...
